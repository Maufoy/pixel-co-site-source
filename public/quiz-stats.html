<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel.Co — Estatísticas do Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',system-ui,sans-serif; background:#08090b; color:#f7f8f8; }
.header { background:linear-gradient(135deg,#111215,#191b1f); border-bottom:1px solid rgba(255,255,255,0.07); padding:32px 20px; text-align:center; }
.header h1 { font-size:24px; font-weight:800; letter-spacing:-0.03em; }
.header h1 span { color:#14a886; }
.header .sub { color:#8a8f98; font-size:13px; margin-top:4px; }
.container { max-width:800px; margin:0 auto; padding:24px 16px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:28px; }
.stat-card { background:#111215; border:1px solid rgba(255,255,255,0.07); border-radius:12px; padding:18px; text-align:center; }
.stat-card .num { font-size:32px; font-weight:800; color:#14a886; }
.stat-card .label { font-size:11px; color:#8a8f98; margin-top:2px; }

.question-card { background:#111215; border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:22px; margin-bottom:16px; }
.question-card h3 { font-size:14px; font-weight:700; margin-bottom:14px; color:#c1d66d; }
.option-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.option-row:last-child { margin-bottom:0; }
.option-row .opt-label { font-size:13px; font-weight:500; min-width:140px; color:#f7f8f8; }
.option-row .opt-track { flex:1; height:24px; background:rgba(255,255,255,0.04); border-radius:6px; overflow:hidden; position:relative; }
.option-row .opt-fill { height:100%; border-radius:6px; display:flex; align-items:center; padding-left:8px; font-size:11px; font-weight:700; color:#000; min-width:30px; transition:width 0.8s ease; }
.option-row .opt-pct { font-size:12px; color:#8a8f98; min-width:50px; text-align:right; }

.empty { text-align:center; padding:60px 20px; color:#8a8f98; }
.empty .ico { font-size:48px; margin-bottom:12px; }
.empty h3 { font-size:18px; font-weight:600; margin-bottom:6px; color:#f7f8f8; }
.empty p { font-size:14px; }

.loading { text-align:center; padding:60px; color:#8a8f98; }
.spin { width:28px;height:28px;border:3px solid rgba(255,255,255,0.08);border-top-color:#14a886;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 12px; }
@keyframes spin{to{transform:rotate(360deg)}}

.footer { text-align:center; padding:24px; color:#5c5f66; font-size:12px; border-top:1px solid rgba(255,255,255,0.07); margin-top:32px; }

.refresh-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:rgba(20,168,134,0.1); border:1px solid rgba(20,168,134,0.2); border-radius:8px; color:#14a886; font-size:12px; font-weight:600; cursor:pointer; margin:0 0 20px auto; }
.refresh-btn:hover{background:rgba(20,168,134,0.2);}

#total-leads { font-size:13px; color:#8a8f98; margin-bottom:20px; text-align:center; }
</style>
</head>
<body>

<div class="header">
  <h1>Quiz <span>Stats</span></h1>
  <div class="sub">Pixel.Co — Página Express</div>
</div>

<div class="container">
  <div id="app">
    <div class="loading" id="loading">
      <div class="spin"></div>
      <p>Carregando estatísticas...</p>
    </div>
  </div>
</div>

<div class="footer">
  Atualizado em tempo real · <a href="javascript:location.reload()" style="color:#14a886;text-decoration:none;font-weight:600;">↻ Atualizar</a>
</div>

<script>
const COLORS = ['#14a886','#c1d66d','#85adff','#fbbf24','#f87171','#a78bfa','#fb923c','#4ade80','#38bdf8','#f472b6'];

(async function() {
  const $ = id => document.getElementById(id);
  const app = document.getElementById('app');

  try {
    const res = await fetch('/api/quiz-stats');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    
    if (!data.total_submissions || data.total_submissions === 0) {
      app.innerHTML = `
        <div class="empty">
          <div style="font-size:48px;margin-bottom:12px">📊</div>
          <h3>Nenhum dado ainda</h3>
          <p>Assim que alguém preencher o quiz, as estatísticas aparecerão aqui.</p>
          <p style="margin-top:8px;font-size:11px;color:#5c5f66;">O quiz está em <a href="/pagina-express-v2/" style="color:#14a886;">/pagina-express-v2/</a></p>
        </div>`;
      return;
    }

    const totals = data.total_submissions;
    const leadsEl = `/api/lead`; // we'll get lead count separately

    let html = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="num">${totals}</div>
          <div class="label">Quiz Finalizados</div>
        </div>
        <div class="stat-card">
          <div class="num" id="lead-count">—</div>
          <div class="label">Leads Capturados</div>
        </div>
      </div>
      <button class="refresh-btn" onclick="location.reload()">↻ Atualizar dados</button>
    `;

    const questions = data.questions || {};
    const labels = data.labels || {};
    const optLabels = data.option_labels || {};

    let colorIdx = 0;
    for (const [q, options] of Object.entries(questions)) {
      const total = Object.values(options).reduce((a,b) => a+b, 0);
      const qLabel = labels[q] || q;
      
      html += `<div class="question-card"><h3>❓ ${qLabel}</h3>`;
      
      // Sort options by count descending
      const sorted = Object.entries(options).sort((a,b) => b[1] - a[1]);
      
      sorted.forEach(([opt, count], i) => {
        const pct = total > 0 ? (count / total * 100) : 0;
        const label = (optLabels[q] && optLabels[q][opt]) ? optLabels[q][opt] : opt;
        const color = COLORS[colorIdx % COLORS.length];
        colorIdx++;
        
        html += `
          <div class="option-row">
            <div class="opt-label">${label}</div>
            <div class="opt-track">
              <div class="opt-fill" style="width:${pct}%;background:${color}">${count}</div>
            </div>
            <div class="opt-pct">${pct.toFixed(1)}%</div>
          </div>`;
      });
      
      html += `<div style="margin-top:8px;font-size:11px;color:#5c5f66;text-align:right;">Total: ${total} respostas</div>`;
      html += `</div>`;
    }

    app.innerHTML = html;

    // Try to get lead count
    try {
      const leadsRes = await fetch('/api/lead');
      if (leadsRes.ok) {
        const leadsData = await leadsRes.json();
        if (leadsData?.total !== undefined) {
          document.getElementById('lead-count').textContent = leadsData.total;
        }
      }
    } catch(e) {
      document.getElementById('lead-count').textContent = '—';
    }

  } catch(e) {
    app.innerHTML = `
      <div class="empty">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <h3>Erro ao carregar</h3>
        <p>Não foi possível buscar as estatísticas.</p>
        <p style="margin-top:8px;font-size:12px;color:#f87171;">${e.message}</p>
      </div>`;
  }
})();
</script>
</body>
</html>
